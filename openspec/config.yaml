# openspec/config.yaml
schema: spec-driven

context: |
  Project: LifeOS — mobile-first responsive web app to track a person's
  entire life across modules: Finance (base module everything links back
  to), Health, Nutrition, Recipes, Shopping List, Car Control, and Goals,
  with more modules planned later.
  Tech stack: Next.js (App Router) + TypeScript + Tailwind v4 + shadcn/ui
  (retokenized), pnpm. Supabase (Postgres + Auth + Storage) lands in
  sub-slice 1B/2A.
  Architecture: modular monolith, schema-per-module, src/modules/{name}/
  {domain,data,ui,api} with a single public api/ barrel per module, enforced
  by eslint-plugin-boundaries (see design.md §2).
  Testing: Vitest (unit) set up in sub-slice 1A; pgTAP and Playwright land
  in sub-slices 1B/2A/2C once there is a database/UI surface to test
  against. Critical-logic focus, not strict TDD (design.md §9).
  Style: design-token driven (src/design-system/tokens), light+dark from
  day one, pill-shaped interactive elements, 20-24px card radius.

strict_tdd: false

testing:
  test_runner: vitest
  test_layers:
    unit: true
    integration: false
    e2e: false
  coverage: false
  quality_tools:
    linter: eslint (flat config, eslint-plugin-boundaries)
    type_checker: tsc --noEmit
    formatter: none detected
  detected: 2026-08-04
  note: >
    Sub-slice 1A (scaffold + design system + boundary lint) landed. Unit
    layer covers the ESLint boundary rule and theme-selection mechanism.
    pgTAP (database) and Playwright (e2e) are intentionally deferred until
    sub-slices 1B (core schema) and 2C (minimal Finance UI) give them a
    real subject, per design.md §9's testing strategy table.

rules:
  proposal:
    - Include rollback plan for risky changes
    - Note that Finance is the base module; flag any change in another
      module that assumes or requires Finance data
  specs:
    - Use Given/When/Then for scenarios
    - Use RFC 2119 keywords (MUST, SHALL, SHOULD, MAY)
    - Mobile-first: scenarios should account for small-viewport behavior
  design:
    - Include sequence diagrams for complex flows
    - Document architecture decisions with rationale
    - Document cross-module dependencies explicitly (e.g. Health -> Finance)
  tasks:
    - Group by phase, use hierarchical numbering
    - Keep tasks completable in one session
  apply:
    guidelines:
      - Follow existing code patterns established in sub-slice 1A
    tdd: false           # critical-logic focus per design.md §9, not blanket TDD
    test_command: "pnpm test"
  verify:
    test_command: "pnpm test"
    build_command: "pnpm verify"
    coverage_threshold: 0
  archive:
    - Warn before merging destructive deltas
