      speculative — actual `throws_ok`/`is` failures against the live local stack):
      (1) the void-transaction fixture needed `voided_at` set to satisfy the pre-existing
      `tx_void_fields` CHECK constraint; (2) the "non-member's DELETE affects zero rows"
