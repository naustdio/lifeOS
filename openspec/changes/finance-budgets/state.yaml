    deviation: >
      Design.md's Testing Strategy (§8) and the proposal's success criteria state
      "finance/api shows zero diff" / "git diff --exit-code src/modules/finance/api/". Two
      real implementation-time conflicts with the ESLint boundary Gate A (app may import
      only module-api/design-system/shared) forced touching src/modules/finance/api/:
      (1) app-layer server code (presupuestos/actions.ts, movimientos/page.tsx,
      editar/page.tsx) needs listBudgetsWithProgress/getProgressForCategory/
      upsertBudgetLimit/removeBudget, which the boundary rule forbids importing directly
      from finance/data — resolved by re-exporting them from the EXISTING
      finance/api/index.ts, the same precedent that file's own header comment already
      establishes for listActiveCategories/getHouseholdSummary; (2) TransactionForm.tsx
      and EditTransactionForm.tsx are "use client" components that need the pure
      evaluateBudgetImpact/budgetDeltaForEdit functions, but finance/api/index.ts starts
      with `import "server-only"`, which breaks the Next.js client build if imported from
      a client component (this was verified for real: `pnpm verify` failed with a
      concrete "You're importing a component that needs server-only" build error before
      the fix) — resolved by adding a SECOND file,
      src/modules/finance/api/budget-evaluation.ts, still under the module-api ESLint
      pattern (src/modules/*/api/**) but with no server-only import, reserved for
      framework-free re-exports a client component may import. recordTransaction/
      updateTransaction (the real write seam design.md's zero-diff criterion was written
      to protect) are byte-for-byte unchanged. This is reported as a deviation, not
      silently absorbed, per the apply-phase rule to note discovered design gaps.
    verify_gate: "pnpm verify — PASS (eslint + tsc --noEmit + check-tokens.mjs + next build; /presupuestos now in the route list, 12 routes total)."
