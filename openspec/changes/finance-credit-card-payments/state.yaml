      raised 22023 ("card terms apply only to credit_card accounts") instead of the expected
      42501, because the type-gate trigger is a plain function (not SECURITY DEFINER) and its own
      `exists (select 1 from finance.accounts ...)` lookup runs under the caller's RLS — the
      account is invisible to a non-member, so the trigger's own existence check fails first,
      same "not found before not allowed" precedent as finance.enforce_budget_category(). (b) a
      non-member's UPDATE/DELETE did not throw at all — a USING-only RLS policy on a table that
      DOES have a delete policy filters non-matching rows silently (0 rows affected), it does not
      raise; throwing 42501 only happens when there is NO policy at all for that operation (as
      with finance.accounts' delete, which has zero delete policies). Rewrote both assertions to
      match the actual, correct, secure behavior instead of forcing a wrong expectation.
