    concurrency_finding: >
      CC-011's scripted 2-connection race test initially asserted "both concurrent calls collapse
      onto exactly one shared pair" per tasks.md's literal wording. Running it FOR REAL against
      two genuine concurrent `docker exec psql` connections revealed this is structurally
      unreachable by design, not a bug: `select ... for update` under READ COMMITTED means the
      losing connection, once unblocked by the winner's commit, RE-READS the ALREADY-ADVANCED
      `next_due_date` (Postgres always gives a lock-waiter the latest committed row version) — it
      cannot see the pre-advance value the winner saw. So two genuinely concurrent, organically
      fired confirm() calls with no external retry signal always resolve onto two DIFFERENT
      (each still fully-balanced) occurrences, never a collision. This is actually a STRONGER
      form of the no-half-pair guarantee (impossible for two racers to even attempt the same
      conflicting insert), not a weaker one. The script's assertions were corrected to check the
      real, achievable, and still-meaningful invariant: neither call ever returns NULL, total
      posted rows for the definition are always even, and every transfer_group_id present has
      exactly 2 rows summing to zero. Verified 4/4 clean runs. The genuine same-occurrence replay
      scenario (spec.md scenario 2) remains covered by the pgTAP replay test's manual cursor
      rewind (CC-007), which is the only way to reproduce it deterministically.
